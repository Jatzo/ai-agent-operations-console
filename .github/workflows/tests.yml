name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
        timeout-minutes: 5
      - name: Unit tests
        run: python -m pytest tests --ignore=tests/browser_check.py -q
        timeout-minutes: 15
